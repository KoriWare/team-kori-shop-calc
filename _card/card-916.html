<!doctype html><html><head><meta charset="utf-8"><style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1080px;height:1920px;background:#0a0a0c;overflow:hidden}
.card{position:relative;width:1080px;height:1920px;padding:150px 90px 130px;display:flex;flex-direction:column;align-items:center;text-align:center;
 background:radial-gradient(ellipse at 80% 45%,rgba(168,85,247,.30),transparent 55%),
 radial-gradient(ellipse at 10% 100%,rgba(45,212,191,.16),transparent 50%),#0a0a0c;
 font-family:'Inter',sans-serif;color:#f2f2f7}
.card:before{content:"";position:absolute;inset:30px;border:1.5px solid #2a2a3a;border-radius:44px}
.eyebrow{font-family:'JetBrains Mono',monospace;font-size:32px;letter-spacing:.18em;color:#2dd4bf;font-weight:600}
h1{font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:128px;line-height:1.0;margin-top:36px;letter-spacing:-.02em}
h1 span{color:#c084fc}
.sub{font-size:40px;color:#c8c8d4;margin-top:40px;line-height:1.45}
.diagram{width:820px;height:856px;margin-top:40px}
.pills{display:flex;gap:18px;margin-top:60px;flex-wrap:wrap;justify-content:center}
.pill{font-size:34px;font-weight:600;padding:16px 30px;border-radius:999px;border:2px solid #7c3aed;background:rgba(124,58,237,.18)}
.pill.t{border-color:#14b8a6;background:rgba(45,212,191,.12)}
.url{margin-top:auto;font-family:'JetBrains Mono',monospace;font-size:30px;color:#8b8ba0}
</style></head><body><div class="card">
